services:
  redis:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    secrets:
      - redis_pw
    configs:
      - source: redis_conf
        target: /usr/local/etc/redis/redis.conf

secrets:
  redis_pw:
    external: true

configs:
  redis_conf:
    external: true